<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>copperDemo test</title>
<style>html,body{margin:0;background:#07021a;overflow:hidden;font:12px monospace;color:#cfe}#ui{position:fixed;left:8px;top:8px;display:flex;gap:4px;z-index:2}button{font:inherit;padding:3px 7px;background:#1a0a30;color:#cfe;border:1px solid #5a3a8a;cursor:pointer}#fps{position:fixed;right:8px;top:8px;z-index:2}</style></head><body>
<div id="ui"></div><div id="fps"></div>
<script type="module">
import * as THREE from '../../../vendor/three/three.module.js';
import { EffectComposer } from '../../../vendor/three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from '../../../vendor/three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from '../../../vendor/three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from '../../../vendor/three/addons/postprocessing/OutputPass.js';
import { GLSL as EG } from '../env/common.js';
import { create } from './copperDemo.js';

const url = new URLSearchParams(location.search);
const q = +(url.get('q') ?? 2), dpr = +(url.get('dpr') ?? 1);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(dpr); renderer.setSize(innerWidth, innerHeight); renderer.setClearColor(0x07021a);
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 1, 6000);
camera.setViewOffset(innerWidth, innerHeight, -innerWidth * 0.14, 0, innerWidth, innerHeight); // subject pushed right like the real camera
const holo = new THREE.Mesh(new THREE.IcosahedronGeometry(30, 1), new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true }));
holo.position.set(0, 30, 0);
const main = new THREE.Scene(); main.add(holo);
const stage = new THREE.Scene();

// mock ctx (the real one is built by the director)
const N = 256, nd = new Uint8Array(N * N * 4); let s = 1234567; for (let i = 0; i < nd.length; i++) { s = (s * 16807) % 2147483647; nd[i] = s & 255; }
const noise = new THREE.DataTexture(nd, N, N, THREE.RGBAFormat); noise.wrapS = noise.wrapT = THREE.RepeatWrapping; noise.magFilter = THREE.LinearFilter; noise.minFilter = THREE.LinearMipmapLinearFilter; noise.generateMipmaps = true; noise.needsUpdate = true;
const U = { localTime: { value: 0 }, alert: { value: 0 }, pulse: { value: 0 }, fade: { value: 1 }, accent: { value: new THREE.Color(1, 0.17, 0.84) }, accent2: { value: new THREE.Color(0, 0.94, 1) },
  res: { value: new THREE.Vector2() }, guardRect: { value: new THREE.Vector4(0.30, 0.30, 0.985, 0.93) }, guardAmt: { value: 0.45 } };
const COMMON = `uniform float uTime,uAlert,uPulse,uFade; uniform vec3 uAccent,uAccent2; uniform sampler2D uNoise;
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec3 pal(float t,vec3 a,vec3 b,vec3 c,vec3 d){return a+b*cos(6.28318*(c*t+d));}`;
const FINISH = EG.GUARD + `vec3 alertMix(vec3 c){float l=dot(c,vec3(.299,.587,.114));vec3 r=mix(vec3(1.,.15,.05),vec3(1.,.55,.1),smoothstep(0.,1.,l));return mix(c,r*l*1.3,uAlert);}
vec3 finish(vec3 c){c=alertMix(c)*guard()*uFade;float l=dot(c,vec3(.299,.587,.114));if(l>.3&&l<1.)c*=mix(1.,.3/l,.5);return c;}`;
const ctx = {
  THREE, renderer, camera, stage, quality: q, rnd: (() => { let a = 42; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })(),
  opts: url, time: { value: 0 }, ...U, sharedNoise: noise, GLSL: { COMMON, FINISH },
  common() { return { uTime: U.localTime, uAlert: U.alert, uPulse: U.pulse, uFade: U.fade, uAccent: U.accent, uAccent2: U.accent2, uRes: U.res, uGuardRect: U.guardRect, uGuardAmt: U.guardAmt, uNoise: { value: noise } }; },
  track(...o) { return o[0]; },
  backdrop(m) { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3)); const me = new THREE.Mesh(g, m); me.frustumCulled = false; me.renderOrder = -1000; stage.add(me); return me; },
};
const scene = create(ctx);

const composer = new EffectComposer(renderer);
const rp = new RenderPass(stage, camera); composer.addPass(rp);
const rp2 = new RenderPass(main, camera); rp2.clear = false; rp2.clearDepth = true; composer.addPass(rp2);
const g = scene.grade;
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), g.bloom, g.bloomRadius, g.bloomThreshold); composer.addPass(bloom);
composer.addPass(new OutputPass());
const setRes = () => { renderer.getDrawingBufferSize(U.res.value); composer.setSize(innerWidth, innerHeight); };
setRes();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.setViewOffset(innerWidth, innerHeight, -innerWidth * 0.14, 0, innerWidth, innerHeight); setRes(); });

const ui = document.getElementById('ui');
let qq = q;
for (const [n, f] of [['alert', () => { U.alert.target = U.alert.target ? 0 : 1; }], ['ripple', () => scene.ripple({ x: 0, z: 0, strength: 1 })], ['enter', () => scene.enter(2.5)], ['exit', () => scene.exit(2.5)], ['quality', () => { qq = (qq + 1) % 3; scene.setQuality(qq); }]]) {
  const b = document.createElement('button'); b.textContent = n; b.onclick = f; ui.appendChild(b);
}
let last = performance.now(), n = 0, acc = 0, ft = [];
const par = new THREE.Vector3();
window.__bloom = bloom; window.__scene = scene; window.__U = U; window.__ft = ft; window.__renderer = renderer;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now; n++; acc += dt; ft.length < 600 && ft.push(dt);
  if (acc > 1) { document.getElementById('fps').textContent = (n / acc).toFixed(0) + ' fps'; window.__fps = n / acc; n = 0; acc = 0; }
  U.localTime.value = (U.localTime.value + dt) % 3600;
  U.alert.value += ((U.alert.target || 0) - U.alert.value) * Math.min(1, dt * 3);
  U.pulse.value = Math.max(0, U.pulse.value - dt * 1.6);
  const cx = Math.sin(now / 5000) * 270;
  camera.position.set(cx, 20, 160); camera.lookAt(cx, 20, -100);
  par.set(cx, 0, 0);
  holo.position.x = cx; holo.rotation.y += dt * 0.5;
  scene.update(dt, U.localTime.value, { camera, dt, k: 1, phase: 'live', alert: U.alert.value, camX: cx, par, story: { x: 0, z: 0 }, transition: -1 });
  composer.render();
  requestAnimationFrame(frame);
}
scene.enter(2);
requestAnimationFrame(frame);
if (url.get('ripple')) setTimeout(() => scene.ripple({ strength: 1 }), +url.get('ripple'));
if (url.get('alert')) U.alert.target = 1;
</script></body></html>
