<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>particles test</title>
<style>html,body{margin:0;background:#07021a;overflow:hidden;font:12px monospace;color:#cfe}#ui{position:fixed;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;z-index:2}button{font:inherit;padding:3px 7px;background:#1a0a30;color:#cfe;border:1px solid #5a3a8a;cursor:pointer}#fps{position:fixed;right:8px;top:8px}</style></head><body>
<div id="ui"></div><div id="fps"></div>
<script type="module">
import * as THREE from '../../../vendor/three/three.module.js';
import { createParticles } from './particles.js';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); renderer.setClearColor(0x07021a);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 1, 6000);
camera.position.set(0, 30, 160); camera.lookAt(0, 8, -100);
const holo = new THREE.Mesh(new THREE.IcosahedronGeometry(30, 1), new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true }));
holo.position.set(40, 30, 0); scene.add(holo);
const ctx = { alert: { value: 0 }, accent: { value: new THREE.Color(1, 0.17, 0.84) }, accent2: { value: new THREE.Color(0, 0.94, 1) },
  res: { value: new THREE.Vector2() }, guardRect: { value: new THREE.Vector4(0.30, 0.30, 0.985, 0.93) }, guardAmt: { value: 0.45 }, quality: 2 };
const setRes = () => { renderer.getDrawingBufferSize(ctx.res.value); };
setRes();
const p = createParticles(scene, ctx);
const C = (h) => new THREE.Color(h);
const base = { stars: 0.7, starTwinkle: 0.6, dust: 0.6, rain: 0, snow: 0, embers: 0, fireflies: 0, motes: 0, wind: 0, fall: 1 };
const presets = {
  classic: {}, snow: { snow: 0.35, stars: 1 }, rain: { rain: 0.6, dust: 0.2, wind: 1, weatherCol: C('#9ad0ff') },
  embers: { embers: 0.5, stars: 0.5, weatherCol: C('#ff6a2a') }, fireflies: { fireflies: 0.4, weatherCol: C('#b0ff70') },
  motes: { motes: 0.6, weatherCol: C('#7ad0ff') }, mix: { rain: 0.2, snow: 0.2, embers: 0.2, fireflies: 0.2, motes: 0.2 },
};
const ui = document.getElementById('ui');
function setPreset(n) { p.setParams({ ...base, ...presets[n], weatherCol: presets[n].weatherCol || C('#cfe8ff') }); }
for (const n of Object.keys(presets)) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => setPreset(n); ui.appendChild(b); }
for (const [n, f] of [['shooting star', () => p.shootingStar()], ['comet', () => p.comet()], ['quality', () => { q = (q + 1) % 3; p.setQuality(q); }], ['alert', () => { ctx.alert.value = 1 - ctx.alert.value; }]]) { const b = document.createElement('button'); b.textContent = n; b.onclick = f; ui.appendChild(b); }
let q = 2;
const url = new URLSearchParams(location.search);
setPreset(url.get('p') || 'classic');
if (url.get('p') === 'classic' || !url.get('p')) { p.shootingStar(); }
if (url.get('comet')) p.comet();
let last = performance.now(), n = 0, acc = 0, errs = 0;
function frame(now) {
  const dt = (now - last) / 1000; last = now; n++; acc += dt;
  if (acc > 1) { document.getElementById('fps').textContent = (n / acc).toFixed(0) + ' fps'; n = 0; acc = 0; }
  holo.rotation.y += dt * 0.4;
  if (url.get('sim')) camera.position.x = Math.sin(now / 4000) * 20; camera.lookAt(0, 8, -100);
  p.update(dt, now / 1000, camera);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__p = p;
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); setRes(); });
</script></body></html>
